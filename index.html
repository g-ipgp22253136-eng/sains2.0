    <!-- 音效 JS (Web Audio API) -->
    <script>
        // 音效生成器
        let soundEnabled = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new AudioContext();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'plant') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'harvest') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.1); // A5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
        }
    </script>

            { unit: "单元5: 动物", q: "老虎和狮子只吃其他动物的肉，它们属于什么食性？", options: ["肉食动物", "草食动物", "杂食动物"], ans: 0, explain: "只吃肉类的动物称为肉食动物。" },
            { unit: "单元5: 动物", q: "大熊猫最喜欢吃竹叶，它属于什么食性？", options: ["草食动物", "肉食动物", "杂食动物"], ans: 0, explain: "只吃植物（如竹叶、草）的动物称为草食动物。" },
            { unit: "单元5: 动物", q: "小鸡既吃小虫子（肉），也吃谷物（植物），它属于什么？", options: ["杂食动物", "肉食动物", "草食动物"], ans: 0, explain: "既吃植物也吃动物的属于杂食动物。" },
            { unit: "单元5: 动物", q: "猴子喜欢吃香蕉，也会吃昆虫，它是什么食性？", options: ["杂食动物", "草食动物", "肉食动物"], ans: 0, explain: "猴子属于杂食动物。" },
            { unit: "单元5: 动物", q: "老鹰具有尖锐的爪子和弯曲的喙，主要用来做什么？", options: ["捕抓和撕碎猎物", "采蜜", "吸引注意"], ans: 0, explain: "老鹰是肉食鸟类，尖爪和弯喙利于捕食。" },
            { unit: "单元5: 动物", q: "下列哪种动物会【飞】？", options: ["蝴蝶", "猫咪", "金鱼"], ans: 0, explain: "蝴蝶拥有翅膀，可以在空中飞翔。" },
            { unit: "单元5: 动物", q: "猫咪身体表面覆盖着什么，可以保持温暖？", options: ["毛发", "羽毛", "外壳"], ans: 0, explain: "猫咪等哺乳动物身上覆盖着柔软的毛发。" },

            // --- 单元6: 植物 (部位与功能) ---
            { unit: "单元6: 植物", q: "植物吸取土壤里的水份和养分，主要是靠哪个部位？", options: ["根", "花", "果实"], ans: 0, explain: "根深深扎在泥土里，吸收水份和矿物质。" },
            { unit: "单元6: 植物", q: "植物的哪一个部位支撑着整棵植物，使其直立？", options: ["茎", "叶子", "花朵"], ans: 0, explain: "茎是植物的“支柱”，负责输送水份和支撑植物。" },
            { unit: "单元6: 植物", q: "植物大多数呈绿色，吸收阳光制造食物的部位是？", options: ["叶子", "根", "种子"], ans: 0, explain: "叶子含有叶绿素，能利用阳光制造食物。" },
            { unit: "单元6: 植物", q: "植物鲜艳夺目、能吸引昆虫帮忙传粉的部位是？", options: ["花", "根", "茎"], ans: 0, explain: "美丽的花朵能吸引蜜蜂和蝴蝶传粉。" },
            { unit: "单元6: 植物", q: "花朵谢了之后，通常会结出什么来包裹种子？", options: ["果实", "泥土", "树枝"], ans: 0, explain: "果实可以保护里面的种子。" },
            { unit: "单元6: 植物", q: "把种子播种到泥土里，在适宜条件下会发芽成长为？", options: ["新植物", "石头", "小虫"], ans: 0, explain: "种子是新植物生命的开始。" },
            { unit: "单元6: 植物", q: "大树的茎通常是硬硬的，我们称为什么茎？", options: ["木质茎", "草质茎", "软茎"], ans: 0, explain: "大树具有坚硬粗壮的“木质茎”。" },
            { unit: "单元6: 植物", q: "小草和向日葵的茎比较柔软，称为什么茎？", options: ["草质茎", "木质茎", "石头茎"], ans: 0, explain: "比较柔软易弯曲的茎叫草质茎。" },
            { unit: "单元6: 植物", q: "植物的叶子通常通过什么连结在茎上？", options: ["叶柄", "花瓣", "根尖"], ans: 0, explain: "叶柄将叶片连结在茎或树枝上。" },
            { unit: "单元6: 植物", q: "吃苹果时，我们吃的是苹果树的哪一部分？", options: ["果实", "根", "叶子"], ans: 0, explain: "苹果是苹果树结出的甜美果实。" },
            { unit: "单元6: 植物", q: "植物如果完全没有了【根】，会发生什么事？", options: ["无法吸收水份而枯萎", "长得更高", "结出更多果实"], ans: 0, explain: "没有根就无法吸收水份，植物会干枯死亡。" },
            { unit: "单元6: 植物", q: "下列哪种植物会开出漂亮的花朵？", options: ["玫瑰", "苔藓", "蕨类"], ans: 0, explain: "玫瑰是开花植物。" },
            { unit: "单元6: 植物", q: "西瓜里面黑黑小小的东西是什么？", options: ["种子", "根", "花朵"], ans: 0, explain: "西瓜籽就是西瓜的种子。" },
            { unit: "单元6: 植物", q: "向日葵的花朵总是喜欢朝向哪边？", options: ["太阳", "月亮", "风吹的方向"], ans: 0, explain: "向日葵具有向光性，花朵朝向太阳。" },
            { unit: "单元6: 植物", q: "植物生长需要水份、空气和什么？", options: ["阳光", "牛奶", "果汁"], ans: 0, explain: "阳光、水和空气是植物生长的基本需求。" },
            { unit: "单元6: 植物", q: "我们要爱护植物，下列哪项做法是正确的？", options: ["定期浇水和晒太阳", "乱摘花朵", "踩踏小草"], ans: 0, explain: "给植物定期浇水和阳光才是爱护植物的行为！" }
        ];

        // 游戏全局数据状态
        let coins = 0;
        let gems = 0;
        let fertilizers = 0;
        let barn = {}; // 仓库记录 { id: count }
        let selectedSeed = seedTypes[0]; // 当前选中的种子
        let farmPlots = Array(9).fill(null).map((_, i) => ({ id: i, state: 'empty', crop: null, timer: 0, totalTime: 0 }));

        // 给予新手第一个可直接收割/生长的初始作物
        farmPlots[0] = { id: 0, state: 'ready', crop: seedTypes[0], timer: 0, totalTime: 8 };

        // 答题引擎状态
        let currentQuizIndex = 0;

        // 初始化
        window.onload = function() {
            renderPlots();
            renderShop();
            renderBarn();
            loadQuestion(0);
            updateUI();

            // 定时器：处理农作物生长计时
            setInterval(gameLoop, 1000);
        };

        // UI 刷新
        function updateUI() {
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('gem-count').innerText = gems;
            document.getElementById('fertilizer-count').innerText = fertilizers;

            // 手持种子提示
            document.getElementById('current-seed-tag').innerText = `${selectedSeed.icon} ${selectedSeed.name}种子`;
        }

        // 页面切换
        function switchTab(tab) {
            playSound('click');
            document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-pink-500', 'text-white');
                btn.classList.add('bg-white', 'text-pink-600');
            });

            document.getElementById(`page-${tab}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.remove('bg-white', 'text-pink-600');
            activeBtn.classList.add('bg-pink-500', 'text-white');

            if (tab === 'barn') renderBarn();
        }

        // ================= 农场逻辑 (FARM) =================
        function renderPlots() {
            const container = document.getElementById('plots-container');
            container.innerHTML = '';

            farmPlots.forEach((plot, index) => {
                const plotEl = document.createElement('div');
                plotEl.className = `plot-soil rounded-3xl h-28 sm:h-36 relative flex flex-col items-center justify-center cursor-pointer border-4 transition transform hover:scale-105 ${plot.state === 'ready' ? 'plot-ready border-amber-300' : 'border-amber-800/40'}`;
                
                plotEl.onclick = () => handlePlotClick(index);

                if (plot.state === 'empty') {
                    plotEl.innerHTML = `<span class="text-xs text-amber-200/60 font-bold">点击播种</span>`;
                } else if (plot.state === 'growing') {
                    const progressPercent = Math.min(100, Math.floor(((plot.totalTime - plot.timer) / plot.totalTime) * 100));
                    plotEl.innerHTML = `
                        <div class="text-2xl sm:text-3xl sway mb-1">🌱</div>
                        <div class="w-3/4 bg-black/40 rounded-full h-2 border border-white/20 overflow-hidden">
                            <div class="bg-emerald-400 h-full transition-all duration-1000" style="width: ${progressPercent}%"></div>
                        </div>
                        <span class="text-[10px] text-white font-bold mt-1">${plot.timer}s</span>
                        ${fertilizers > 0 ? `<button onclick="event.stopPropagation(); useFertilizer(${index})" class="absolute top-1 right-1 bg-emerald-500 text-white text-[10px] px-1.5 py-0.5 rounded-full shadow border border-white">⚡加速</button>` : ''}
                    `;
                } else if (plot.state === 'ready') {
                    plotEl.innerHTML = `
                        <div class="text-4xl sm:text-5xl sway drop-shadow-md mb-1">${plot.crop.icon}</div>
                        <span class="bg-amber-400 text-amber-900 font-extrabold text-[10px] sm:text-xs px-2 py-0.5 rounded-full shadow animate-bounce">
                            可收割！
                        </span>
                    `;
                }

                container.appendChild(plotEl);
            });
        }

        function handlePlotClick(index) {
            const plot = farmPlots[index];

            if (plot.state === 'empty') {
                // 检查金币是否够买种子
                if (coins < selectedSeed.cost) {
                    showFloatText(`金币不足！需要 ${selectedSeed.cost} 金币`, event.clientX, event.clientY, 'text-rose-500');
                    playSound('wrong');
                    return;
                }

                coins -= selectedSeed.cost;
                plot.state = 'growing';
                plot.crop = selectedSeed;
                plot.timer = selectedSeed.growTime;
                plot.totalTime = selectedSeed.growTime;

                playSound('plant');
                showFloatText(`播种 ${selectedSeed.name}`, event.clientX, event.clientY, 'text-emerald-600');
                updateUI();
                renderPlots();

            } else if (plot.state === 'ready') {
                // 收割
                const cropId = plot.crop.id;
                barn[cropId] = (barn[cropId] || 0) + 1;

                playSound('harvest');
                showFloatText(`+1 ${plot.crop.name} ${plot.crop.icon}`, event.clientX, event.clientY, 'text-amber-500');

                // 重置土地
                plot.state = 'empty';
                plot.crop = null;
                plot.timer = 0;

                updateUI();
                renderPlots();
            }
        }

        // 使用加速肥料
        function useFertilizer(plotIndex) {
            if (fertilizers <= 0) return;
            const plot = farmPlots[plotIndex];
            if (plot && plot.state === 'growing') {
                fertilizers--;
                plot.timer = 0;
                plot.state = 'ready';
                playSound('harvest');
                updateUI();
                renderPlots();
            }
        }

        // 游戏时间循环 (每秒)
        function gameLoop() {
            let updated = false;
            farmPlots.forEach(plot => {
                if (plot.state === 'growing') {
                    plot.timer--;
                    if (plot.timer <= 0) {
                        plot.state = 'ready';
                    }
                    updated = true;
                }
            });
            if (updated) renderPlots();
        }

        // ================= 答题逻辑 (QUIZ) =================
        function loadQuestion(index) {
            if (index >= quizQuestions.length) {
                index = 0; // 循环或提示通关
            }
            currentQuizIndex = index;
            const q = quizQuestions[index];

            document.getElementById('quiz-progress-text').innerText = `${index + 1} / ${quizQuestions.length}`;
            document.getElementById('quiz-unit-badge').innerText = q.unit;
            document.getElementById('quiz-question').innerText = q.q;

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-white hover:bg-purple-100 text-slate-700 font-bold p-3 md:p-4 rounded-xl border-2 border-purple-200 shadow-sm text-left text-sm md:text-base transition flex items-center gap-2';
                btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-purple-200 text-purple-700 text-xs flex items-center justify-center font-extrabold">${String.fromCharCode(65 + optIdx)}</span> ${opt}`;
                btn.onclick = () => checkAnswer(optIdx);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-explanation').classList.add('hidden');
        }

        function checkAnswer(selectedOpt) {
            const q = quizQuestions[currentQuizIndex];
            const explainBox = document.getElementById('quiz-explanation');
            const explainTitle = document.getElementById('explain-title');
            const explainText = document.getElementById('explain-text');

            if (selectedOpt === q.ans) {
                // 回答正确
                playSound('correct');
                coins += 20;
                fertilizers += 1;
                gems += 1;

                explainTitle.innerText = "🎉 回答正确！太棒了！";
                explainTitle.className = "font-bold text-emerald-800 text-sm";
                explainBox.className = "bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 mb-4";
                explainText.innerText = `${q.explain} (获得 +20金币, +1魔法肥料)`;

                updateUI();
            } else {
                // 回答错误
                playSound('wrong');
                explainTitle.innerText = "❌ 差一点点就对啦，再接再厉！";
                explainTitle.className = "font-bold text-rose-800 text-sm";
                explainBox.className = "bg-rose-50 border-2 border-rose-300 rounded-2xl p-4 mb-4";
                explainText.innerText = `正确答案是: ${q.options[q.ans]}。解析: ${q.explain}`;
            }

            explainBox.classList.remove('hidden');
        }

        function nextQuestion() {
            playSound('click');
            loadQuestion(currentQuizIndex + 1);
        }

        // ================= 商店逻辑 (SHOP) =================
        function renderShop() {
            // 渲染种子商店
            const seedsGrid = document.getElementById('shop-seeds-grid');
            seedsGrid.innerHTML = '';

            seedTypes.forEach(seed => {
                const card = document.createElement('div');
                card.className = 'bg-amber-50 rounded-2xl p-3 border-2 border-amber-200 flex flex-col items-center shadow-sm';
                card.innerHTML = `
                    <div class="text-4xl mb-1">${seed.icon}</div>
                    <h3 class="font-bold text-amber-900 text-sm">${seed.name}</h3>
                    <p class="text-xs text-amber-600 mb-2">成熟时间: ${seed.growTime}秒</p>
                    <button onclick="selectSeed('${seed.id}')" class="w-full ${selectedSeed.id === seed.id ? 'bg-emerald-500' : 'bg-amber-400 hover:bg-amber-500'} text-white font-bold py-1.5 rounded-xl text-xs transition">
                        ${selectedSeed.id === seed.id ? '当前选择中' : `种植单价: ${seed.cost}金币`}
                    </button>
                `;
                seedsGrid.appendChild(card);
            });

            // 渲染装饰商店
            const decorGrid = document.getElementById('shop-decor-grid');
            decorGrid.innerHTML = '';

            decorTypes.forEach(decor => {
                const card = document.createElement('div');
                card.className = 'bg-pink-50 rounded-2xl p-3 border-2 border-pink-200 flex flex-col items-center shadow-sm';
                card.innerHTML = `
                    <div class="text-4xl mb-1">${decor.icon}</div>
                    <h3 class="font-bold text-pink-900 text-sm">${decor.name}</h3>
                    <p class="text-xs text-pink-500 mb-2">梦幻农场专属装饰</p>
                    <button onclick="buyDecor('${decor.id}')" class="w-full ${decor.bought ? 'bg-gray-300 text-gray-600' : 'bg-pink-400 hover:bg-pink-500 text-white'} font-bold py-1.5 rounded-xl text-xs transition">
                        ${decor.bought ? '已拥有' : `购买: ${decor.cost}金币`}
                    </button>
                `;
                decorGrid.appendChild(card);
            });
        }

        function toggleShopCategory(cat) {
            playSound('click');
            if (cat === 'seeds') {
                document.getElementById('shop-seeds-grid').classList.remove('hidden');
                document.getElementById('shop-decor-grid').classList.add('hidden');
                document.getElementById('btn-shop-seeds').className = 'bg-amber-500 text-white font-bold text-xs md:text-sm px-4 py-2 rounded-xl shadow';
                document.getElementById('btn-shop-decor').className = 'bg-slate-200 text-slate-700 font-bold text-xs md:text-sm px-4 py-2 rounded-xl shadow hover:bg-slate-300';
            } else {
                document.getElementById('shop-seeds-grid').classList.add('hidden');
                document.getElementById('shop-decor-grid').classList.remove('hidden');
                document.getElementById('btn-shop-decor').className = 'bg-pink-500 text-white font-bold text-xs md:text-sm px-4 py-2 rounded-xl shadow';
                document.getElementById('btn-shop-seeds').className = 'bg-slate-200 text-slate-700 font-bold text-xs md:text-sm px-4 py-2 rounded-xl shadow hover:bg-slate-300';
            }
        }

        function selectSeed(seedId) {
            playSound('click');
            const found = seedTypes.find(s => s.id === seedId);
            if (found) {
                selectedSeed = found;
                updateUI();
                renderShop();
                switchTab('farm');
            }
        }

        function buyDecor(decorId) {
            const decor = decorTypes.find(d => d.id === decorId);
            if (!decor || decor.bought) return;

            if (coins >= decor.cost) {
                coins -= decor.cost;
                decor.bought = true;
                playSound('harvest');
                updateUI();
                renderShop();
                showFloatText(`成功购买 ${decor.name}!`, event.clientX, event.clientY, 'text-pink-500');
            } else {
                playSound('wrong');
                showFloatText(`金币不足！需要 ${decor.cost} 金币`, event.clientX, event.clientY, 'text-rose-500');
            }
        }

        // ================= 仓库逻辑 (BARN) =================
        function renderBarn() {
            const grid = document.getElementById('barn-items-grid');
            grid.innerHTML = '';

            let hasItems = false;

            Object.keys(barn).forEach(cropId => {
                const count = barn[cropId];
                if (count > 0) {
                    hasItems = true;
                    const cropInfo = seedTypes.find(s => s.id === cropId);
                    const card = document.createElement('div');
                    card.className = 'bg-amber-50 rounded-2xl p-3 border-2 border-amber-200 flex flex-col items-center';
                    card.innerHTML = `
                        <div class="text-3xl mb-1">${cropInfo.icon}</div>
                        <div class="font-bold text-xs text-amber-900">${cropInfo.name}</div>
                        <div class="text-xs text-amber-600 font-bold mt-0.5">数量: x${count}</div>
                        <button onclick="sellSingleCrop('${cropId}')" class="mt-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-[10px] px-2 py-1 rounded-lg w-full">
                            卖出 (+${cropInfo.sellPrice}金币)
                        </button>
                    `;
                    grid.appendChild(card);
                }
            });

            if (!hasItems) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-8 text-amber-700/60 font-bold text-xs">
                        仓库空空如也，快去耕种并收获农作物吧！
                    </div>
                `;
            }
        }

        function sellSingleCrop(cropId) {
            if (barn[cropId] && barn[cropId] > 0) {
                const cropInfo = seedTypes.find(s => s.id === cropId);
                barn[cropId]--;
                coins += cropInfo.sellPrice;
                playSound('click');
                updateUI();
                renderBarn();
            }
        }

        function sellAllCrops() {
            let totalEarned = 0;
            Object.keys(barn).forEach(cropId => {
                const count = barn[cropId];
                if (count > 0) {
                    const cropInfo = seedTypes.find(s => s.id === cropId);
                    totalEarned += count * cropInfo.sellPrice;
                    barn[cropId] = 0;
                }
            });

            if (totalEarned > 0) {
                coins += totalEarned;
                playSound('harvest');
                updateUI();
                renderBarn();
                showFloatText(`售出所有收获，获得 +${totalEarned}金币！`, window.innerWidth/2, window.innerHeight/2, 'text-amber-500');
            }
        }

        // 飘字动画特效
        function showFloatText(text, x, y, colorClass = 'text-amber-500') {
            const container = document.getElementById('float-container');
            const el = document.createElement('div');
            el.className = `absolute font-extrabold text-sm md:text-base ${colorClass} float-text pointer-events-none drop-shadow`;
            el.style.left = `${x || window.innerWidth/2}px`;
            el.style.top = `${y || window.innerHeight/2}px`;
            el.innerText = text;

            container.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }
    </script>
</body>
</html>
